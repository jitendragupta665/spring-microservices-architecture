server.port=8085
spring.application.name=api-gateway

# The gateway is the only service reachable from outside (through the Ingress), so expose the
# minimum: health for Kubernetes probes, info for build/version. Never '*': heapdump, env,
# configprops leak data; loggers, refresh, serviceregistry let anyone change the running system.
management.endpoints.web.exposure.include=health,info
# /actuator/health/liveness and /readiness groups for Kubernetes probes
management.endpoint.health.probes.enabled=true

# ---- Backends: plain Kubernetes DNS names (ADR-0006), no service registry -----------------
# CoreDNS resolves the Service name to its ClusterIP; kube-proxy picks a ready pod per connection.
services.order.url=http://order-service:8081
services.user.url=http://user-service:8080

# ---- Routes (ADR-0007): the path is forwarded UNCHANGED (no StripPrefix) -------------------
# /api/v1/orders/** also matches /api/v1/orders itself, but not /api/v1/ordersX.
spring.cloud.gateway.server.webflux.routes[0].id=orders
spring.cloud.gateway.server.webflux.routes[0].uri=${services.order.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.server.webflux.routes[1].id=users
spring.cloud.gateway.server.webflux.routes[1].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**
