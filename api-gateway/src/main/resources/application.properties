server.port=8085
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://eureka:8761/eureka
# The gateway is the only service reachable from outside (through the Ingress), so expose the
# minimum: health for Kubernetes probes, info for build/version. Never '*': heapdump, env,
# configprops leak data; loggers, refresh, serviceregistry let anyone change the running system.
management.endpoints.web.exposure.include=health,info
# /actuator/health/liveness and /readiness groups for Kubernetes probes
management.endpoint.health.probes.enabled=true
spring.cloud.gateway.routes[0].id=order-service
spring.cloud.gateway.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/order/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1