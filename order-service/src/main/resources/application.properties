spring.application.name=order-service
server.port=8081
# Where user-service lives. In Kubernetes and docker-compose this is the Service / container
# name, resolved by DNS (ADR-0006). Override with CLIENTS_USER_SERVICE_BASE_URL.
clients.user-service.base-url=http://user-service:8080
# Errors as RFC 9457 problem JSON (application/problem+json), also for 400 validation errors
spring.mvc.problemdetails.enabled=true
# Actuator: only health, for the Kubernetes probes (/actuator/health/liveness and /readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
