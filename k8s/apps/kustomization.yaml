apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - eureka.yaml
  - user-service.yaml
  - order-service.yaml
  - api-gateway.yaml
  - ingress.yaml
  - network-policies.yaml   # zero-trust: deny all, then allow each real call (ADR 0005)
# Single place that decides which build runs in the cluster.
# newName = the local registry (scripts/registry-up.sh); nodes pull from it, so a rebuilt
# cluster can start the apps without loading images by hand.
# newTag = first 7 chars of the main commit that CI built and loaded into kind.
images:
  - name: eureka
    newName: localhost:5001/eureka
    newTag: "1773899"
  - name: user-service
    newName: localhost:5001/user-service
    newTag: "1773899"
  - name: order-service
    newName: localhost:5001/order-service
    newTag: "1773899"
  - name: api-gateway
    newName: localhost:5001/api-gateway
    newTag: "1773899"
