# ---------- Deployment: "keep 1 copy of the Eureka registry running" ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: shop
spec:
  replicas: 1                 # standalone Eureka; 2+ copies would need peer-replication config
  selector:
    matchLabels:
      app: eureka             # "the pods I own are the ones carrying this label"
  template:                   # the blueprint for each pod
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: eureka:1.0   # loaded into every node with `kind load`
          ports:
            - containerPort: 8761
          env:
            # Make the JVM size its heap from the container's memory LIMIT (cgroup), not the node's RAM
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests: {cpu: 100m, memory: 256Mi}   # what the scheduler reserves on a node
            limits:   {memory: 512Mi}              # cgroup hard cap: above this = OOMKilled
          readinessProbe:     # "send traffic only when the dashboard answers"
            httpGet: {path: /, port: 8761}
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ---------- Service: stable name + IP "eureka" in front of the pod ----------
# The apps already use http://eureka:8761/eureka, and CoreDNS resolves "eureka"
# inside namespace "shop" to this Service, so no app config change is needed.
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: shop
spec:
  selector:
    app: eureka               # route to ready pods with this label
  ports:
    - port: 8761              # Service port
      targetPort: 8761        # container port
