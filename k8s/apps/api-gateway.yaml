apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          ports:
            - containerPort: 8085
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {memory: 512Mi}
          # Actuator probe groups (management.endpoint.health.probes.enabled=true).
          readinessProbe:     # "send me traffic": the app finished starting and can serve requests
            httpGet: {path: /actuator/health/readiness, port: 8085}
            periodSeconds: 5
          startupProbe:       # JVM start can take minutes on a busy laptop: allow up to 36 x 5 s = 3 min.
            httpGet: {path: /actuator/health/liveness, port: 8085}   # Liveness only counts after this passes
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:      # "restart me": the process is stuck. 3 misses in a row (30 s) -> restart
            httpGet: {path: /actuator/health/liveness, port: 8085}
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shop
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8085
      targetPort: 8085
