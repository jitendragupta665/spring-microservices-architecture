apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shop
spec:
  replicas: 3                 # two copies: one can die or be replaced while the other serves
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:1.0
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            # Lesson from the compose experiment: register the pod IP in Eureka, not the hostname.
            # A pod hostname (e.g. user-service-7d9f-abcde) is NOT resolvable through cluster DNS.
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "true"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {memory: 512Mi}
          readinessProbe:     # /user is cheap and has no downstream dependency, so it is a fair "ready" check
            httpGet: {path: /user, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shop
spec:
  selector:
    app: user-service
  ports:
    - port: 8080
      targetPort: 8080
