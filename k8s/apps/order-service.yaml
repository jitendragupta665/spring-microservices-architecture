apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {memory: 512Mi}
          # Actuator probe groups (management.endpoint.health.probes.enabled=true). They answer
          # "can THIS process serve?" and do NOT call user-service: if a dependency's blip marked
          # every order pod unready, the failure would cascade into a full outage.
          readinessProbe:     # "send me traffic": the app finished starting and can serve requests
            httpGet: {path: /actuator/health/readiness, port: 8081}
            periodSeconds: 5
          startupProbe:       # JVM start can take minutes on a busy laptop: allow up to 36 x 5 s = 3 min.
            httpGet: {path: /actuator/health/liveness, port: 8081}   # Liveness only counts after this passes
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:      # "restart me": the process is stuck. 3 misses in a row (30 s) -> restart
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shop
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
