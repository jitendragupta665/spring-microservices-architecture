apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:1.0
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "true"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {memory: 512Mi}
          # NOT /order: that endpoint calls user-service, so if user-service had a blip,
          # every order pod would be marked unready too and the failure would cascade.
          # A readiness check should answer "can THIS process take traffic?", so we only
          # check that Tomcat accepts TCP connections on 8081.
          readinessProbe:
            tcpSocket: {port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shop
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
