# Local lab cluster: 1 control-plane + 2 workers, each node is a Docker container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
networking:
  # No kindnet: scripts/lab-up.sh installs Calico (k8s/platform/calico) right after creation.
  # Until then nodes stay NotReady, which is expected.
  disableDefaultCNI: true
  # Pod IP range; must equal CALICO_IPV4POOL_CIDR in k8s/platform/calico/kustomization.yaml.
  # Does not overlap the Docker "kind" network (172.x) or Services (10.96.0.0/12).
  podSubnet: "192.168.0.0/16"
# containerd on every node reads per-registry config from /etc/containerd/certs.d.
# scripts/registry-up.sh then adds localhost:5001 -> kind-registry (the local image registry).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    # Lets an ingress controller on this node receive traffic from the laptop's localhost:80/443
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
