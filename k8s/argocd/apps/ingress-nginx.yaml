apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jitendragupta665/spring-microservices-architecture.git
    targetRevision: main
    path: k8s/platform/ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true     # delete objects that were removed from Git
      selfHeal: true  # undo manual kubectl edits (drift) back to what Git says
    syncOptions:
      - CreateNamespace=true
