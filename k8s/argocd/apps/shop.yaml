apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
  # Cascade delete: removing this file from Git deletes the app's workloads too,
  # instead of leaving them orphaned in the cluster.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jitendragupta665/spring-microservices-architecture.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true     # delete objects that were removed from Git
      selfHeal: true  # undo manual kubectl edits (drift) back to what Git says
    syncOptions:
      - CreateNamespace=true
      # Delete objects removed from Git only AFTER every other resource in the sync is
      # applied and healthy (new Deployments rolled out). A removed dependency (e.g. Eureka in
      # PR #29) then stays available to the old pods until their replacements are ready.
      - PruneLast=true
