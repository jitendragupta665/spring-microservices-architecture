apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The kind provider manifest already pins the controller to the node labelled
# ingress-ready=true (the control-plane, which owns hostPort 80/443 via kind-cluster.yaml).
resources:
  - deploy.yaml
# Job spec.template is immutable, so Argo CD cannot patch these Jobs in place
# ("field is immutable"). Run them as Sync hooks instead: Argo deletes the old Job
# and creates a fresh one on every sync. Same idea as the Helm chart's
# pre-install/pre-upgrade hooks with before-hook-creation.
patches:
  - target:
      kind: Job
      name: ingress-nginx-admission-(create|patch)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
