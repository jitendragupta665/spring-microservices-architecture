apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The controller uses hostPort 80/443, and only the control-plane node publishes those ports to
# the laptop (extraPortMappings in k8s/kind-cluster.yaml, node label ingress-ready=true).
# Upstream's kind manifest dropped that nodeSelector after v1.12, so we pin it ourselves below.
resources:
  - deploy.yaml
# Job spec.template is immutable, so Argo CD cannot patch these Jobs in place
# ("field is immutable"). Run them as Sync hooks instead: Argo deletes the old Job
# and creates a fresh one on every sync. Same idea as the Helm chart's
# pre-install/pre-upgrade hooks with before-hook-creation.
patches:
  - target:
      kind: Job
      name: ingress-nginx-admission-(create|patch)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  - target:
      kind: Deployment
      name: ingress-nginx-controller
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/ingress-ready
        value: "true"
