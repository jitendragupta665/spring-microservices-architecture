apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
# Argo CD manages itself from Git (app-of-apps child "argocd").
# Upstream install manifest, pinned. To upgrade: read the release notes / upgrade guide between
# versions, bump the tag below in a PR, review the rendered diff, merge.
# Why not the Helm chart: the chart adds app.kubernetes.io/instance + component to every
# Deployment/StatefulSet selector. Selectors are immutable, so switching would force Argo CD to
# delete and recreate its own workloads mid-sync. This base renders the exact objects already live.
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  # Serve the UI/API over plain HTTP. Lab only: reached via `kubectl port-forward` on 127.0.0.1
  # (the browser pane rejects the self-signed cert). In production TLS ends at the ingress/LB.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
  # LAB TRADE-OFF: drop upstream's NetworkPolicies. kindnet's policy engine (kube-network-policies
  # via NRI + nfqueue 101) wedges on this WSL2 host: containerd times out its NRI plugin and the
  # queue stops being read while still bound, so `queue flags bypass` never kicks in and every new
  # connection of a policy-selected pod (DNS included) hangs. These 7 are the only policies in the
  # cluster, so removing them takes every pod out of the queue path. Restore once the lab runs a
  # CNI with reliable policy enforcement (Calico/Cilium).
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-application-controller-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-applicationset-controller-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-dex-server-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-notifications-controller-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-redis-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-repo-server-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-server-network-policy
