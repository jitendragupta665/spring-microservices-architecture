services:

  eureka:
    build:
      context: ./discovery-server
      additional_contexts:
        parent: ./shop-parent   # shared parent POM
    container_name: eureka
    ports:
      - "8761:8761"

  user-service:
    build:
      context: ./user-service
      additional_contexts:
        parent: ./shop-parent   # shared parent POM
    container_name: user-service
    depends_on:
      - eureka
    ports:
      - "8080:8080"

  order-service:
    build:
      context: ./order-service
      additional_contexts:
        parent: ./shop-parent   # shared parent POM
    container_name: order-service
    depends_on:
      - eureka
      - user-service
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: ./api-gateway
      additional_contexts:
        parent: ./shop-parent   # shared parent POM
    container_name: api-gateway
    depends_on:
      - eureka
      - user-service
      - order-service
    ports:
      - "8085:8085"