# Local run without Kubernetes. Service discovery is the same as in the cluster: plain DNS names.
# Compose puts every service on one network where the service name resolves to its container,
# so http://user-service:8080 works here exactly like the Kubernetes Service name (ADR-0006).
services:

  user-service:
    build:
      context: ./user-service
      additional_contexts:
        parent: ./shop-parent   # shared parent POM
    ports:
      - "8080:8080"

  order-service:
    build:
      context: ./order-service
      additional_contexts:
        parent: ./shop-parent   # shared parent POM
    depends_on:
      - user-service
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: ./api-gateway
      additional_contexts:
        parent: ./shop-parent   # shared parent POM
    depends_on:
      - user-service
      - order-service
    ports:
      - "8085:8085"
