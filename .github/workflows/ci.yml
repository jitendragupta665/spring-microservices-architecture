# CI: build + test every service inside Docker.
#  - Pull requests: verify only (build + tests). Nothing in the cluster changes.
#  - Push to main (after merge): also tag with the commit SHA and load into kind.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: build ${{ matrix.service }}
    # PUBLIC repo + self-hosted runner on the owner's laptop:
    # only run PRs whose branch lives in THIS repo, never PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, kind-lab]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: eureka,        dir: discovery-server}
          - {service: user-service,  dir: user-service}
          - {service: order-service, dir: order-service}
          - {service: api-gateway,   dir: api-gateway}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute image tag (short commit SHA)
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build + test (multi-stage Docker build)
        run: docker build -t ${{ matrix.service }}:${TAG} ./${{ matrix.dir }}

      - name: Load image into kind cluster (main only)
        if: github.event_name != 'pull_request'
        run: kind load docker-image ${{ matrix.service }}:${TAG} --name lab

      - name: Summary
        # Block scalar (|): the shell line can contain ": " without breaking YAML
        run: |
          echo "Built \`${{ matrix.service }}:${TAG}\` (event: ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  # After every merge to main: delete app images that are not running, not pinned in Git,
  # and not from the last 3 main commits. See scripts/lab-cleanup.sh for the rules.
  cleanup:
    name: cleanup old images
    needs: build                       # only after ALL 4 builds succeeded
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, kind-lab]
    concurrency:
      group: lab-cleanup               # never two cleanups at the same time
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Prune old lab images
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          # Fetch the LATEST main, not just this run's commit: a newer merge may already have
          # loaded its images, and they must be in the keep set.
          git fetch --depth=30 origin main
          scripts/lab-cleanup.sh --apply
