spring.application.name=user-service
server.port=8080
# Errors as RFC 9457 problem JSON (application/problem+json), also for framework errors
spring.mvc.problemdetails.enabled=true
# Actuator: only health, for the Kubernetes probes (/actuator/health/liveness and /readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
